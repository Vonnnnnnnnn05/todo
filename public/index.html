<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #000; 
      color: #fff; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      padding: 40px;
      background: #1a1a1a;
      border-radius: 15px;
      box-shadow: 0 10px 50px rgba(255, 255, 255, 0.1);
    }
    h1 { 
      font-size: 2.5em; 
      margin-bottom: 30px; 
      text-align: center;
      font-weight: 300;
      letter-spacing: 2px;
    }
    .input-group {
      display: flex;
      margin-bottom: 30px;
      gap: 10px;
    }
    input[type="text"] { 
      flex: 1;
      padding: 15px 20px; 
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #fff;
    }
    input[type="text"]::placeholder {
      color: #666;
    }
    button { 
      padding: 15px 30px; 
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 16px;
    }
    button:hover {
      background: #ddd;
      transform: translateY(-2px);
    }
    ul { list-style: none; }
    li { 
      padding: 20px; 
      margin: 15px 0; 
      background: #000; 
      border: 1px solid #333;
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      gap: 15px;
      transition: all 0.3s;
    }
    li:hover {
      border-color: #fff;
      transform: translateX(5px);
    }
    li span {
      flex: 1;
      font-size: 18px;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #fff;
    }
    .completed { 
      text-decoration: line-through; 
      color: #555;
      opacity: 0.6;
    }
    .delete-btn { 
      background: #fff;
      color: #000;
      border: none; 
      padding: 8px 16px; 
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .delete-btn:hover {
      background: #ff0000;
      color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TODO</h1>
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="Enter a todo..." onkeypress="if(event.key==='Enter') addTodo()">
      <button onclick="addTodo()">Add</button>
    </div>
    <ul id="todoList"></ul>
  </div>

  <script>
    const API_URL = '/api';
    
    async function fetchTodos() {
      const response = await fetch(`${API_URL}/todos`);
      const todos = await response.json();
      renderTodos(todos);
    }

    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      list.innerHTML = '';
      todos.forEach(todo => {
        const li = document.createElement('li');
        li.innerHTML = `
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo('${todo._id}', ${!todo.completed})">
          <span class="${todo.completed ? 'completed' : ''}">${todo.text}</span>
          <button class="delete-btn" onclick="deleteTodo('${todo._id}')">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;

      await fetch(`${API_URL}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      input.value = '';
      fetchTodos();
    }

    async function deleteTodo(id) {
      await fetch(`${API_URL}/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    async function toggleTodo(id, completed) {
      await fetch(`${API_URL}/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }

    // Load todos on page load
    fetchTodos();
  </script>
</body>
</html>
