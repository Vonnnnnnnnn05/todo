<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #f9f9f9;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border-radius: 8px;
      border: 2px solid #ddd;
      font-size: 16px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #000;
    }

    button {
      padding: 14px 24px;
      border-radius: 8px;
      border: none;
      background: #000;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #333;
    }

    ul {
      list-style: none;
    }

    li {
      background: #fff;
      border: 1px solid #ddd;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      transition: 0.3s;
    }

    li:hover {
      border-color: #000;
    }

    li span {
      flex: 1;
      font-size: 17px;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #000;
    }

    .completed {
      text-decoration: line-through;
      color: #777;
      opacity: 0.6;
    }

    .delete-btn {
      background: #000;
      color: #fff;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #ff0000;
    }

    /* 📱 Mobile Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .input-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      li {
        flex-wrap: wrap;
      }

      .delete-btn {
        width: 100%;
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>TODO</h1>

    <div class="input-group">
      <input
        type="text"
        id="todoInput"
        placeholder="Enter a todo..."
        onkeypress="if(event.key==='Enter') addTodo()"
      />
      <button onclick="addTodo()">Add</button>
    </div>

    <ul id="todoList"></ul>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';

    async function fetchTodos() {
      const response = await fetch(`${API_URL}/todos`);
      const todos = await response.json();
      renderTodos(todos);
    }

    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      list.innerHTML = '';

      todos.forEach(todo => {
        const li = document.createElement('li');
        li.innerHTML = `
          <input type="checkbox" ${todo.completed ? 'checked' : ''}
            onchange="toggleTodo('${todo._id}', ${!todo.completed})">
          <span class="${todo.completed ? 'completed' : ''}">
            ${todo.text}
          </span>
          <button class="delete-btn" onclick="deleteTodo('${todo._id}')">
            Delete
          </button>
        `;
        list.appendChild(li);
      });
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;

      await fetch(`${API_URL}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      input.value = '';
      fetchTodos();
    }

    async function deleteTodo(id) {
      await fetch(`${API_URL}/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    async function toggleTodo(id, completed) {
      await fetch(`${API_URL}/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }

    fetchTodos();
  </script>
</body>
</html>
